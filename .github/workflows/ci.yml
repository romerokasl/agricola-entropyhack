name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Check
        run: npm run type-check

      - name: Next.js Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "example-anon-key"

  ml-check:
    name: ML Syntax & Dependencies Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Core ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f ml/requirements.txt ]; then pip install -r ml/requirements.txt; fi

      - name: Python Syntax & Lint Check
        run: |
          # Chequeo estricto de errores de sintaxis o variables no definidas
          flake8 ml --count --select=E9,F63,F7,F82 --show-source --statistics
          # Compilación estática de scripts
          python -m py_compile ml/synthetic_data.py ml/train.py ml/api.py
